<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medical Career Portfolio</title>
<meta name="description" content="A long-term academic and professional portfolio documenting the journey from medical student to psychiatrist and researcher." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" style="display:none;">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-mark">MD</div>
      <div class="sidebar__brand-text">
        <strong id="brand-title">Medical Career Portfolio</strong>
        <span id="brand-sub">Academic & Research Record</span>
      </div>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer">
      <button class="btn btn--ghost btn--sm" id="theme-toggle" title="Toggle theme">🌙 <span data-t="Theme">Theme</span></button>
      <button class="btn btn--ghost btn--sm" id="lang-toggle" title="Language">🌐 <span id="lang-toggle-label">العربية</span></button>
      <button class="btn btn--ghost btn--sm" id="owner-login-btn" title="Owner login">🔑 <span data-t="Owner Login">Owner Login</span></button>
      <button class="btn btn--ghost btn--sm" id="lock-btn" title="Exit owner mode" style="display:none;">🔒 <span data-t="Exit Owner Mode">Exit Owner Mode</span></button>
    </div>
  </aside>

  <div class="main-col">
    <div class="preview-banner" id="preview-banner" style="display:none;">
      <span data-t="Previewing as a visitor would see it">Previewing as a visitor would see it</span>
      <button class="btn btn--sm btn--primary" id="exit-preview-btn" data-t="Exit Preview">Exit Preview</button>
    </div>
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" title="Menu">☰</button>
      <div class="topbar__search">
        <input type="search" id="global-search" data-t-placeholder="Search the whole portfolio..." placeholder="Search the whole portfolio..." />
      </div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="preview-toggle-btn" title="Preview as visitor" style="display:none;">👁️ <span data-t="Preview as Visitor">Preview as Visitor</span></button>
        <button class="btn btn--primary btn--sm" id="cv-shortcut-btn">📄 <span data-t="CV Builder">CV Builder</span></button>
      </div>
    </header>
    <main class="content" id="view-root"></main>
  </div>
</div>

<div id="toast-host"></div>

<script src="js/i18n.js"></script>
<script src="js/owner-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/schema.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/academic.js"></script>
<script src="js/views/psychiatry.js"></script>
<script src="js/views/research.js"></script>
<script src="js/views/english.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/cvbuilder.js"></script>
<script src="js/views/personalstatement.js"></script>
<script src="js/views/timeline.js"></script>
<script src="js/views/analytics.js"></script>
<script src="js/views/search.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
